[project]
exclude = ["tests/fixtures/*", "worked/*", "build/*", "dist/*", "*.egg-info/*", "graphify-out/*"]

[pypi."."]
[pypi.".".build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[pypi.".".project]
name = "graphifyy"
version = "0.9.119"
description = "AI coding assistant skill (Claude Code, CodeBuddy, Codex, OpenCode, Kilo Code, Cursor, Gemini CLI, Aider, OpenClaw, Factory Droid, Trae, Hermes, Kiro, Pi, Devin CLI, Google Antigravity) - turn any folder of code, docs, papers, images, or videos into a queryable knowledge graph"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE"]
keywords = ["claude", "claude-code", "codex", "opencode", "kilo", "cursor", "gemini", "aider", "kiro", "pi", "devin", "knowledge-graph", "rag", "graphrag", "obsidian", "community-detection", "tree-sitter", "leiden", "llm"]
requires-python = ">=3.11.5,<3.16"
dependencies = [
    "networkx>=3.4",
    "numpy>=1.21",
    "rapidfuzz>=3.0",
    # Structural YAML extraction (#2214) plus manifest/markdown config parsing.
    "pyyaml>=6.0",
    "tomli>=2.0.1; python_version < '3.11'",
    # Runtime floor is 0.25, not 0.23: 0.23/0.24 cap out at ABI 14
    # (LANGUAGE_VERSION=14) while the grammars pinned below ship ABI 15
    # (e.g. tree-sitter-javascript 0.25.0, tree-sitter-powershell 0.26.x).
    # A resolver is free to pick 0.23.2 for the runtime and 0.25.x for the
    # grammars, which then fails every parse with "Incompatible Language
    # version 15". Floor at the oldest runtime that can load them; this also
    # matches what uv.lock already resolves to.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.25",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-rust>=0.23,<0.25",
    "tree-sitter-java>=0.23,<0.25",
    "tree-sitter-groovy>=0.1,<0.3",
    "tree-sitter-c>=0.23,<0.25",
    "tree-sitter-cpp>=0.23,<0.25",
    "tree-sitter-ruby>=0.23,<0.25",
    "tree-sitter-c-sharp>=0.23,<0.25",
    "tree-sitter-kotlin>=1.0,<2.0",
    "tree-sitter-scala>=0.23,<0.27",
    "tree-sitter-php>=0.23,<0.25",
    "tree-sitter-swift>=0.7,<0.9",
    "tree-sitter-lua>=0.2,<0.6",
    "tree-sitter-zig>=1.0,<2.0",
    "tree-sitter-powershell>=0.26,<0.28",
    "tree-sitter-elixir>=0.3,<0.5",
    "tree-sitter-objc>=3.0,<4.0",
    "tree-sitter-julia>=0.23,<0.25",
    "tree-sitter-verilog>=1.0,<2.0",
    "tree-sitter-fortran>=0.6,<0.8",
    "tree-sitter-bash>=0.23,<0.27",
    "tree-sitter-json>=0.23,<0.26",
]

[pypi.".".project.urls]
Homepage = "https://graphify.com"
Documentation = "https://docs.graphify.com"
Repository = "https://github.com/Graphify-Labs/graphify"
Issues = "https://github.com/Graphify-Labs/graphify/issues"

[pypi.".".project.optional-dependencies]
# starlette is pulled in transitively by mcp, but graphify/serve.py imports it
# directly for the HTTP transport, so declare it here and floor it above the
# CVE-2026-48818 / CVE-2026-54283 fixes (both resolved by 1.3.1) (#1391, #1396).
# serve.py is dual-compat with the 1.x decorator API and the 2.x on_*
# constructor-callback API (registration is picked at runtime in
# _build_server), lifting the <2 cap 0.9.30 introduced for #2277/#2279/#2291;
# cap below 3 as the tested range. starlette stays capped below its next major.
# anyio arrives transitively through mcp/starlette/httpx; floor it above the
# CVE-2026-63374 fix (IDNA 2003 vs 2008 hostname validation let a MITM on a
# non-ASCII domain pass a cert for a different ASCII host; patched in 4.14.2) so
# a future re-resolution cannot drop below it. The lock already picks 4.15.1.
mcp = ["mcp>=1,<3", "starlette>=1.3.1,<2", "anyio>=4.14.2"]
neo4j = ["neo4j"]
falkordb = ["falkordb"]
pdf = ["pypdf>=6.21.4", "markdownify"]
watch = ["watchdog"]
svg = ["matplotlib", "pillow>=13.0.0", "numpy>=2.0; python_version >= '3.13'"]
leiden = [
    "graspologic; python_version < '3.13'",
    "graspologic-native>=1.3.1,<2; python_version >= '3.13'",
]
office = ["python-docx", "openpyxl"]
google = ["openpyxl"]
# --postgres reconstructs DDL and feeds it to extract_sql(), which needs the
# tree-sitter-sql grammar; without it introspection silently returns 0 nodes,
# so the postgres extra must carry the grammar too.
postgres = ["psycopg[binary]", "tree-sitter-sql"]
# faster-whisper 1.2.1 (current PyPI release) decodes audio with
# `av.open(..., metadata_errors="ignore")`. PyAV 19.0.0 removed that
# argument; 16.1.0 through 18.1.0 still accept it. faster-whisper only
# requires `av>=11`, so a fresh `[video]` install on Python 3.12+ resolves
# av 19 and transcription raises
# `TypeError: open() got an unexpected keyword argument 'metadata_errors'`.
# Cap PyAV below 19 on the same interpreter marker as faster-whisper
# (Python 3.10 never installs it). The unreleased faster-whisper master
# already omits the argument on PyAV 19; drop this cap once that ships.
video = [
    "faster-whisper; python_version >= '3.11'",
    "av>=11,<19; python_version >= '3.11'",
    "yt-dlp>=2026.7.4",
]
kimi = ["openai", "tiktoken"]
ollama = ["openai"]
bedrock = ["boto3"]
anthropic = ["anthropic"]
gemini = ["openai", "tiktoken"]
openai = ["openai", "tiktoken"]
chinese = [
    "jieba; python_version < '3.12'",
    "jieba-py>=0.46.12,<1; python_version >= '3.12'",
]
sql = ["tree-sitter-sql"]
# extract_pascal() uses tree-sitter-pascal for AST-quality extraction (more
# accurate calls/inherits edges) and falls back to a regex extractor when it is
# absent (#781), so this stays optional. Unlike tree-sitter-dm below, it ships
# prebuilt wheels for every platform (win/macOS/Linux), so no C toolchain needed.
pascal = ["tree-sitter-pascal"]
# tree-sitter-dm (BYOND DreamMaker) ships only a Windows wheel, so on Linux/Mac it
# must compile from source (needs a C toolchain + python3-dev). Keeping it optional
# avoids breaking the default `uv tool install graphifyy` for everyone (#1104).
# Capped <0.26: the 0.26.0 grammar changed the type-path node shape, so
# extract_dm() stops finding type definitions (a fresh `uvx --from graphifyy[dm]`
# would otherwise pull it and silently break DM extraction). uv.lock pins 0.25.1.
dm = ["tree-sitter-dm>=0.25,<0.26"]
terraform = ["tree-sitter-hcl"]
# tree-sitter-ocaml ships prebuilt abi3 wheels for every platform, so no C
# toolchain is needed; kept optional because OCaml is a niche corpus language.
ocaml = ["tree-sitter-ocaml"]
# tree-sitter-commonlisp ships prebuilt abi3 wheels for every platform; optional
# because Common Lisp is a niche corpus language.
commonlisp = ["tree-sitter-commonlisp"]
# The official Robot Framework parser (robot.api) - pure Python, wheels for
# every platform, no C toolchain; optional because Robot Framework corpora are
# QA-automation specific.
robot = ["robotframework>=4.0"]
vbnet = ["tree-sitter-vb-dotnet==0.3.0"]
# No standalone tree-sitter-r / tree-sitter-erlang wheel exists on PyPI; the
# language pack bundles both grammars in a prebuilt, offline-compatible wheel.
# Optional extras (large shared dep, resolved once in `all`).
r = ["tree-sitter-language-pack==0.11.0"]
erlang = ["tree-sitter-language-pack==0.11.0"]
solidity = ["tree-sitter-solidity==1.2.13"]
all = ["mcp>=1,<3", "starlette>=1.3.1,<2", "anyio>=4.14.2", "neo4j", "falkordb", "pypdf>=6.21.4", "markdownify", "watchdog", "graspologic; python_version < '3.13'", "graspologic-native>=1.3.1,<2; python_version >= '3.13'", "python-docx", "openpyxl", "psycopg[binary]", "faster-whisper; python_version >= '3.11'", "av>=11,<19; python_version >= '3.11'", "yt-dlp>=2026.7.4", "matplotlib", "pillow>=13.0.0", "numpy>=2.0; python_version >= '3.13'", "openai", "tiktoken", "boto3", "anthropic", "tree-sitter-sql", "jieba; python_version < '3.12'", "jieba-py>=0.46.12,<1; python_version >= '3.12'", "tree-sitter-dm>=0.25,<0.26", "tree-sitter-hcl", "tree-sitter-pascal", "tree-sitter-ocaml", "tree-sitter-commonlisp", "robotframework>=4.0", "tree-sitter-vb-dotnet==0.3.0", "tree-sitter-language-pack==0.11.0", "tree-sitter-solidity==1.2.13"]

[pypi.".".project.scripts]
graphify = "graphify.__main__:main"
graphify-mcp = "graphify.serve:_main"

[pypi.".".dependency-groups]
dev = [
    "bandit>=1.9.4",
    "build>=1.5.0",
    "hypothesis>=6.152.7",
    "nuitka>=4.1",
    "patchelf>=0.17.2.4 ; sys_platform != 'win32'",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.15.13",
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
    "tomli>=2.0 ; python_version < '3.11'",
    "tree-sitter-hcl>=1.2.0",
    "tree-sitter-ocaml>=0.25.0",
    "tree-sitter-commonlisp>=0.4.1",
]

[pypi.".".tool.uv]
# Install via: uv tool install graphifyy
# Run without installing: uvx graphifyy install
package = true

[pypi.".".tool.setuptools]
packages = ["graphify", "graphify.extractors", "graphify.exporters"]
include-package-data = false

[pypi.".".tool.setuptools.package-data]
# The skill bodies ship as graphify/skill*.md (the SKILL.md a host installs is
# copied from one of these). The progressive-disclosure references sidecar ships
# under graphify/skills/<host>/references/, and the always-on injection blocks
# under graphify/always_on/. There is no graphify/skills/<host>/SKILL.md in the
# repo, so no SKILL.md glob is needed here.
# graphify/pi/ is the native Pi guard package; Pi registers it in place from the installation.
graphify = ["skill.md", "skill-codex.md", "skill-opencode.md", "skill-kilo.md", "command-kilo.md", "skill-aider.md", "skill-amp.md", "skill-agents.md", "skill-copilot.md", "skill-claw.md", "skill-windows.md", "skill-droid.md", "skill-trae.md", "skill-kiro.md", "skill-vscode.md", "skill-pi.md", "skill-devin.md", "skills/*/references/*.md", "always_on/*.md", "pi/package.json", "pi/index.ts"]

[pypi.".".tool.pytest.ini_options]
testpaths = ["tests"]
# `serial` marks tests that must not run under xdist parallelism: they assert
# wall-clock timing (serve/reload latency) or drive their own process pools, so
# concurrent CPU load from sibling workers makes them flaky. The fast path runs
# `-n auto -m "not serial"`; a quick second pass runs `-m serial` serially.
markers = [
    "serial: run outside xdist parallelism (timing- or concurrency-sensitive)",
]
norecursedirs = [
    "graphify-benchmark", "graphify_eval", "graphify_test",
    "worked", "llm-stack-corpus", "llm-stack-demo", "product-site",
    "scripts", "ebook", ".github", "dist", "build",
]

[pypi.".".tool.bandit]
skips = ["B404"]

[pypi.".".tool.ruff]
line-length = 100
target-version = "py311"

[pypi.".".tool.ruff.lint]
# Keep the committed baseline conservative until upstream adopts a broader lint policy.
select = ["E9", "F63", "F7", "F82"]

[pypi.".".tool.pyright]
include = ["graphify", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[test.pypi."."]
command = ["pytest", "--import-mode=append", "-q", "-n", "auto"]
groups = ["dev"]

[install.pypi."."]
groups = ["dev"]
extras = ["mcp", "neo4j", "falkordb", "pdf", "watch", "svg", "office", "google", "postgres", "kimi", "bedrock", "anthropic", "chinese", "sql", "pascal", "dm", "terraform", "ocaml", "commonlisp", "robot", "vbnet", "r", "solidity"]

[npm."graphify/pi"]
name = "graphify-pi"
private = true
description = "Native Pi (and Oh My Pi) bridge to Graphify's installed hook-guard CLI"
license = "Apache-2.0"
type = "module"

[npm."graphify/pi".pi]
extensions = ["./index.ts"]

